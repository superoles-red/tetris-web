name: CI

on:
  push:
    branches: [main, 'dsh/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2496eaa44b6f1a099e0a55a57e577f4dc034ead4 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: CPU conformance ROM (fetched, not committed)
        run: node tools/fetch-cpu-test.mjs && node tests/cpu-conformance.mjs
