name: CI

on:
  push:
    branches: [main, 'dsh/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: CPU conformance ROM (fetched, not committed)
        run: node tools/fetch-cpu-test.mjs && node tests/cpu-conformance.mjs
      - name: Build static site (no game data allowed)
        run: node tools/build-site.mjs --output "$RUNNER_TEMP/site"
      - name: Assert site artifact has no ROM/archives
        run: |
          if find "$RUNNER_TEMP/site" -type f \( -iname '*.nes' -o -iname '*.zip' \) | grep -q .; then
            echo 'Game data found in site artifact'; exit 1
          fi
